services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://loguser:logpass@db:5432/logs
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
